name: Flutter CI

on:
  pull_request:
    paths:
      - "frontend_notaris/**"
      - ".github/workflows/flutter-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend_notaris/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-analyze:
    name: Test and analyze (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_notaris

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: frontend_notaris/pubspec.lock

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
